<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semray — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-950:#2E1B36;
    --teal-700:#7A3562;
    --teal-500:#8B5D89;
    --foam:#FDF1F6;
    --foam-dim:#E7C3DA;
    --pink-accent:#D98FB6;
    --pink-light:#FFB3C4;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{height:100%;}

  body{
    font-family:var(--font-body);
    background:linear-gradient(135deg, var(--teal-700) 0%, var(--teal-500) 33%, var(--pink-accent) 66%, var(--pink-light) 100%);
    background-size:260% 260%;
    animation:flow 20s ease-in-out infinite;
    color:var(--foam);
    min-height:100vh;
    overflow:hidden;
  }

  @keyframes flow{
    0%{ background-position:0% 30%; }
    50%{ background-position:100% 70%; }
    100%{ background-position:0% 30%; }
  }

  .app{
    width:100vw;
    height:100vh;
    display:grid;
    grid-template-columns:260px 1fr;
    background:transparent;
    overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:rgba(3,23,22,0.28);
    border-right:1px solid rgba(255,255,255,0.14);
    display:flex;
    flex-direction:column;
    padding:22px 16px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 6px 22px;
    border-bottom:1px solid rgba(255,255,255,0.14);
    margin-bottom:18px;
  }

  .brand-mark{
    width:34px; height:34px;
    flex-shrink:0;
  }

  .brand-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:17px;
    letter-spacing:0.2px;
    color:var(--foam);
  }
  .brand-tag{
    font-size:11px;
    color:var(--foam);
    letter-spacing:0.4px;
    text-transform:uppercase;
  }

  .new-chat{
    display:flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(135deg, var(--teal-500), var(--teal-700));
    border:none;
    color:var(--ink-950);
    font-family:var(--font-body);
    font-weight:600;
    font-size:13.5px;
    padding:11px 14px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 6px 18px rgba(217,143,182,0.35);
  }
  .new-chat:hover{ transform:translateY(-1px); box-shadow:0 8px 22px rgba(217,143,182,0.45); }
  .new-chat:active{ transform:translateY(0); }

  .thread-label{
    font-size:11px;
    color:var(--foam-dim);
    text-transform:uppercase;
    letter-spacing:0.6px;
    margin:22px 8px 10px;
  }

  .threads{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:4px;
    overflow-y:auto;
  }

  .thread{
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    transition:background .15s ease;
    border:1px solid transparent;
  }
  .thread:hover{ background:rgba(255,255,255,0.10); }
  .thread.active{
    background:rgba(217,143,182,0.16);
    border-color:rgba(217,143,182,0.35);
  }
  .thread-title{ font-size:13px; color:var(--foam); font-weight:500; }
  .thread-preview{
    font-size:11.5px;
    color:var(--foam-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .sidebar-footer{
    margin-top:auto;
    padding-top:16px;
    border-top:1px solid rgba(255,255,255,0.14);
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12.5px;
    color:var(--foam-dim);
  }
  .status-dot{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--teal-500);
    box-shadow:0 0 0 3px rgba(217,143,182,0.25);
  }

  /* ---------- Main chat ---------- */
  .chat{
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  .chat-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 24px;
    border-bottom:1px solid rgba(255,255,255,0.14);
    background:rgba(3,23,22,0.22);
  }

  .peer{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .avatar{
    width:38px; height:38px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--teal-500), var(--teal-700));
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-display);
    font-weight:700;
    color:var(--ink-950);
    font-size:14px;
    flex-shrink:0;
  }

  .peer-name{
    font-family:var(--font-display);
    font-size:15px;
    font-weight:600;
    color:var(--foam);
  }
  .peer-status{
    font-size:11.5px;
    color:var(--teal-500);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .peer-status .status-dot{ box-shadow:0 0 0 3px rgba(217,143,182,0.2); }

  .header-actions{ display:flex; gap:10px; }
  .icon-btn{
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center;
    color:var(--foam);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .icon-btn:hover{ background:rgba(255,255,255,0.18); color:var(--foam); }

  /* messages */
  .messages{
    flex:1;
    overflow-y:auto;
    padding:26px 24px;
    display:flex;
    flex-direction:column;
    gap:16px;
    background:linear-gradient(200deg, rgba(122,53,98,0.15), rgba(217,143,182,0.05) 40%, transparent 70%);
  }

  .day-divider{
    align-self:center;
    font-size:11px;
    color:var(--foam-dim);
    background:rgba(255,255,255,0.08);
    padding:4px 12px;
    border-radius:20px;
    margin:6px 0 10px;
    letter-spacing:0.4px;
  }

  .msg-row{
    display:flex;
    gap:10px;
    max-width:74%;
    animation:rise .35s ease both;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .msg-row.bot{ align-self:flex-start; }
  .msg-row.user{ align-self:flex-end; flex-direction:row-reverse; }

  .msg-avatar{
    width:28px; height:28px;
    border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display);
    font-size:11px;
    font-weight:700;
  }
  .msg-row.bot .msg-avatar{
    background:linear-gradient(135deg, var(--teal-500), var(--teal-700));
    color:var(--foam);
  }
  .msg-row.user .msg-avatar{
    background:linear-gradient(135deg, var(--teal-700), var(--ink-950));
    color:var(--ink-950);
  }

  .bubble-wrap{ display:flex; flex-direction:column; gap:4px; }

  .bubble{
    padding:12px 15px;
    border-radius:var(--radius-md);
    font-size:14px;
    line-height:1.5;
  }
  .msg-row.bot .bubble{
    background:rgba(122,53,98,0.28);
    border:1px solid rgba(217,143,182,0.3);
    color:var(--foam);
    border-top-left-radius:4px;
  }
  .msg-row.user .bubble{
    background:linear-gradient(135deg, var(--teal-500), var(--teal-700));
    color:var(--ink-950);
    border-top-right-radius:4px;
    font-weight:500;
  }

  .msg-time{
    font-size:10.5px;
    color:var(--foam-dim);
    padding:0 4px;
  }
  .msg-row.user .msg-time{ text-align:right; }

  /* typing indicator */
  .typing .bubble{
    display:flex;
    align-items:center;
    gap:5px;
    padding:14px 16px;
  }
  .typing-dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--foam-dim);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing-dot:nth-child(2){ animation-delay:.15s; }
  .typing-dot:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{
    0%,60%,100%{ transform:translateY(0); opacity:.5; }
    30%{ transform:translateY(-4px); opacity:1; }
  }

  /* suggestion chips */
  .suggestions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:0 24px 14px;
  }
  .chip{
    font-size:12.5px;
    color:var(--foam);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    padding:7px 13px;
    border-radius:20px;
    cursor:pointer;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .chip:hover{
    background:rgba(217,143,182,0.16);
    border-color:rgba(217,143,182,0.4);
    color:var(--foam);
  }

  /* input */
  .composer{
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:16px 24px 22px;
    border-top:1px solid rgba(255,255,255,0.14);
    background:rgba(3,23,22,0.22);
  }

  .composer-field{
    flex:1;
    display:flex;
    align-items:flex-end;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:var(--radius-md);
    padding:6px 6px 6px 16px;
    transition:border-color .15s ease;
  }
  .composer-field:focus-within{
    border-color:var(--teal-500);
  }

  textarea{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    color:var(--foam);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    max-height:120px;
    padding:8px 0;
  }
  textarea::placeholder{ color:var(--foam-dim); }

  .send-btn{
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    flex-shrink:0;
    background:linear-gradient(135deg, var(--teal-500), var(--teal-700));
    color:var(--ink-950);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform .15s ease, opacity .15s ease;
  }
  .send-btn:hover{ transform:scale(1.06); }
  .send-btn:active{ transform:scale(0.96); }
  .send-btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }

  /* scrollbars */
  .messages::-webkit-scrollbar, .threads::-webkit-scrollbar{ width:6px; }
  .messages::-webkit-scrollbar-thumb, .threads::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,0.25);
    border-radius:10px;
  }

  /* focus visibility */
  button:focus-visible, textarea:focus-visible, .thread:focus-visible{
    outline:2px solid var(--foam);
    outline-offset:2px;
  }

  @media (max-width:720px){
    body{ padding:0; }
    .app{
      grid-template-columns:1fr;
      height:100vh;
      max-width:100%;
      border-radius:0;
    }
    .sidebar{ display:none; }
    .msg-row{ max-width:88%; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#5B6EF5"/>
            <stop offset="50%" stop-color="#B45FE0"/>
            <stop offset="100%" stop-color="#F962B0"/>
          </linearGradient>
        </defs>
        <circle cx="25" cy="24" r="15.5" fill="none" stroke="url(#logoGrad)" stroke-width="2.6"/>
        <circle cx="30" cy="19" r="4.6" fill="url(#logoGrad)"/>
        <path d="M30 25.5c-4 0-7.2 2.6-7.7 6.2h15.4c-.5-3.6-3.7-6.2-7.7-6.2z" fill="url(#logoGrad)"/>
        <circle cx="19.5" cy="24" r="5.6" fill="url(#logoGrad)"/>
        <path d="M19.5 31.5c-4.8 0-8.7 3.1-9.3 7.5h18.6c-.6-4.4-4.5-7.5-9.3-7.5z" fill="url(#logoGrad)"/>
      </svg>
      <div>
        <div class="brand-name">Semray</div>
        <div class="brand-tag">Your personal AI grooming assistant</div>
      </div>
    </div>

    <button class="new-chat" id="newChatBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      New conversation
    </button>

    </ul>
  </aside>

  <!-- Chat panel -->
  <main class="chat">
    <header class="chat-header">
      <div class="peer">
        <div class="avatar">S</div>
        <div>
          <div class="peer-name">Semray</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" title="Search conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" title="More options">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <div class="messages" id="messages">
      <div class="day-divider">Today</div>

      <div class="msg-row bot">
        <div class="msg-avatar">S</div>
        <div class="bubble-wrap">
          <div class="bubble">Hi, I'm Semray. What can I help you think through today?</div>
          <span class="msg-time">9:41 AM</span>
        </div>
      </div>
    </div>

    <div class="suggestions" id="suggestions">
      <div class="chip">Plan my week</div>
      <div class="chip">Explain something simply</div>
      <div class="chip">Help me write a message</div>
    </div>

    <form class="composer" id="composerForm">
      <div class="composer-field">
        <textarea id="chatInput" rows="1" placeholder="Message Semray…"></textarea>
      </div>
      <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12l16-8-6 16-3-7-7-1z" fill="currentColor"/></svg>
      </button>
    </form>
  </main>

</div>

<script>
(function(){
  const messages = document.getElementById('messages');
  const form = document.getElementById('composerForm');
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const suggestions = document.getElementById('suggestions');
  const newChatBtn = document.getElementById('newChatBtn');

  const botReplies = [
    "Got it — tell me a bit more and I'll dig in.",
    "That makes sense. Here's how I'd approach it: break it into smaller steps first.",
    "I can help with that. Want the short version or the detailed one?",
    "Noted. I'll keep that in mind as we go.",
    "Good question — let's work through it together.",
    "Here's a thought: start with the outcome you want, then work backwards."
  ];

  function timeNow(){
    return new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  }

  function scrollToBottom(){
    messages.scrollTop = messages.scrollHeight;
  }

  function addMessage(text, sender){
    const row = document.createElement('div');
    row.className = 'msg-row ' + sender;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = sender === 'bot' ? 'S' : 'Y';

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    const time = document.createElement('span');
    time.className = 'msg-time';
    time.textContent = timeNow();

    wrap.appendChild(bubble);
    wrap.appendChild(time);
    row.appendChild(avatar);
    row.appendChild(wrap);
    messages.appendChild(row);
    scrollToBottom();
  }

  function showTyping(){
    const row = document.createElement('div');
    row.className = 'msg-row bot typing';
    row.id = 'typingRow';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = 'S';

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';

    wrap.appendChild(bubble);
    row.appendChild(avatar);
    row.appendChild(wrap);
    messages.appendChild(row);
    scrollToBottom();
  }

  function removeTyping(){
    const row = document.getElementById('typingRow');
    if(row) row.remove();
  }

  function handleSend(text){
    if(!text.trim()) return;
    addMessage(text.trim(), 'user');
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    suggestions.style.display = 'none';

    showTyping();
    const delay = 700 + Math.random() * 900;
    setTimeout(() => {
      removeTyping();
      const reply = botReplies[Math.floor(Math.random() * botReplies.length)];
      addMessage(reply, 'bot');
      sendBtn.disabled = false;
    }, delay);
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    handleSend(input.value);
  });

  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      handleSend(input.value);
    }
  });

  input.addEventListener('input', function(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  suggestions.addEventListener('click', function(e){
    if(e.target.classList.contains('chip')){
      handleSend(e.target.textContent);
    }
  });

  newChatBtn.addEventListener('click', function(){
    messages.innerHTML = '<div class="day-divider">Today</div>';
    addMessage("Hi, I'm Semray. What can I help you think through today?", 'bot');
    suggestions.style.display = 'flex';
  });

  scrollToBottom();
})();
</script>

</body>
</html>
